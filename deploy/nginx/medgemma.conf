# MedGemma GPU API — nginx (TLS terminatsiyasi + oqim)
#
# O'rnatish:
#   sudo cp deploy/nginx/medgemma.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/medgemma.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ai.example.uz      # <-- o'z domeningiz
#
# Certbot 443 blokini va HTTP->HTTPS yo'naltirishni SHU FAYLGA o'zi qo'shadi.

upstream medgemma_api {
    server 127.0.0.1:8077 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name ai.example.uz;          # <-- O'Z DOMENINGIZNI YOZING

    # --- Xavfsizlik sarlavhalari ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # DICOM arxivi katta bo'lishi mumkin (app tomonida MG_MAX_UPLOAD_MB ham bor)
    client_max_body_size 512M;
    client_body_timeout 600s;

    # PHI: so'rov tanasi diskda keshlanmasin
    proxy_request_buffering off;

    access_log /var/log/nginx/medgemma.access.log;
    error_log  /var/log/nginx/medgemma.error.log;

    location = /healthz {
        proxy_pass http://medgemma_api;
        access_log off;
    }

    location /api/ {
        proxy_pass http://medgemma_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MUHIM: /api/infer va /api/batch — SSE oqimi. Buferlash yoqilsa
        # javob oxirigacha ushlab turiladi va oqim ma'nosini yo'qotadi.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';

        # Butun tekshiruv tahlili uzoq davom etadi (o'nlab seriya).
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Boshqa hamma narsa yopiq — bu API servisi, veb-sayt emas.
    location / {
        return 404;
    }
}
