# MedGemma GPU API — GPU bilan ishga tushirish
#
#   cp .env.example .env      # MG_API_KEY va HF_TOKEN ni to'ldiring
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml logs -f

services:
  medgemma:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: medgemma-api:latest
    restart: unless-stopped
    env_file: ../.env
    environment:
      MG_DATA_DIR: /data
      MG_HOST: 0.0.0.0
      MG_PORT: 8077
    volumes:
      # Bemor tasvirlari (MG_RETENTION_HOURS bo'yicha avtomatik tozalanadi)
      - medgemma-data:/data
      # Model og'irliklari — konteyner qayta qurilganda qayta yuklanmasin
      - medgemma-models:/models
    # DIQQAT: port FAQAT localhost'ga bog'lanadi. Tashqi kirish nginx orqali,
    # TLS bilan. Konteynerni to'g'ridan-to'g'ri internetga ochmang.
    ports:
      - "127.0.0.1:8077:8077"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  medgemma-data:
  medgemma-models:
